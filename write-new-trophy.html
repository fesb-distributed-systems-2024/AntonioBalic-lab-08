<!DOCTYPE html>
<html>
    <head>
        <title>EasyTrophy</title>

        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <link rel="stylesheet" href="/assets/css/write-new-trophy.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </head>

    <body class="min-vh-100">
        <script src="/assets/js/write-new-trophy.js" type="module" defer></script>

        <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="list-all-trophies.html">
                            List All Trophies
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="write-new-trophy.html">
                            Add A Trophy
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <form class="container-sm new-trophy-form">
            <!-- Sportclub input -->
            <div data-mdb-input-init class="form-outline mb-4">
                <label class="form-label" for="form2Example1">Sportclub name</label>
                <input type="text" id="sportclub" class="form-control" />
            </div>
          
            <!-- Trophyname input -->
            <div data-mdb-input-init class="form-outline mb-4">
                <label class="form-label" for="form2Example2">Trophy name</label>
                <input type="text" id="trophyname" class="form-control" />
            </div>

             <!-- Rank input -->
            <div data-mdb-input-init class="form-outline mb-4">
                <label class="form-label" for="form2Example2">Rank</label>
                <input type="number" id="rank" class="form-control" />
            </div>

              <!-- Year input -->
            <div data-mdb-input-init class="form-outline mb-4">
                <label class="form-label" for="form2Example2">Year</label>
                <input type="number" id="year" class="form-control" />
            </div>

               <!-- Sponsors input -->
            <div data-mdb-input-init class="form-outline mb-4">
                <label class="form-label" for="form2Example2">Sponsors</label>
                <input type="text" id="sponsors" class="form-control" />
            </div>
          
            <!-- Submit button -->
            <div class="my-buttons container-sm row">
                <button type="button" id="send-trophy-button" class="btn btn-outline-primary col">Send</button> 
                <button type="button" id="clear-all-trophies-button" class="btn btn-outline-danger col">Clear</button> 
            </div>
        </form>

        <div class="my-buttons container-sm pb-4">
            <button type="button" id="home-button" class="btn btn-outline-info col">Home</button>
        </div>

        <footer class="text-center text-white mb-10" style="background-color: #0a4275;">
            <div class="container p-4">
                <section class="">
                    <p class="d-flex justify-content-center align-items-center">
                        <span class="me-3">
                            <a href="https://github.com/fesb-distributed-systems-2024/AntonioBalic-lab-07" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
                                Backend Source code
                            </a>
                        </span>
                        <a href="https://github.com/fesb-distributed-systems-2024/AntonioBalic-lab-08" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
                            Frontend Source code
                        </a>
                    </p>
                </section>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>

</html>
