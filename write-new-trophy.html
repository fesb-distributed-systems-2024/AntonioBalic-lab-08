<!DOCTYPE html>
<html>
    <head>
        <title>EasyMail</title>

        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <link rel="stylesheet" href="/assets/css/write-new-trophy.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </head>

    <body>
        <script src="/assets/js/write-new-trophy.js" type="module" defer></script>

        <form class="container-sm new-trophy-form">
            <!-- Sportclub input -->
            <div data-mdb-input-init class="form-outline mb-4">
                <label class="form-label" for="form2Example1">Sportclub name</label>
                <input type="text" id="sportclub" class="form-control" />
            </div>
          
            <!-- Trophyname input -->
            <div data-mdb-input-init class="form-outline mb-4">
                <label class="form-label" for="form2Example2">Trophy name</label>
                <input type="text" id="trophyname" class="form-control" />
            </div>

             <!-- Rank input -->
            <div data-mdb-input-init class="form-outline mb-4">
                <label class="form-label" for="form2Example2">Rank</label>
                <input type="number" id="rank" class="form-control" />
            </div>

              <!-- Year input -->
            <div data-mdb-input-init class="form-outline mb-4">
                <label class="form-label" for="form2Example2">Year</label>
                <input type="number" id="year" class="form-control" />
            </div>

               <!-- Sponsors input -->
            <div data-mdb-input-init class="form-outline mb-4">
                <label class="form-label" for="form2Example2">Sponsors</label>
                <input type="text" id="sponsors" class="form-control" />
            </div>
          
            <!-- Submit button -->
            <div class="my-buttons container-sm row">
                <button type="button" id="send-trophy-button" class="btn btn-outline-primary col">Send</button> 
                <button type="button" id="clear-all-trophies-button" class="btn btn-outline-danger col">Clear</button> 
            </div>
        </form>

        <div class="my-buttons container-sm center">
            <button type="button" id="home-button" class="btn btn-outline-info col">Home</button>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>

</html>
