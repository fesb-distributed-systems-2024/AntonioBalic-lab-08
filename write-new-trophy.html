<!DOCTYPE html>
<html>
    <head>
        <title>EasyMail</title>

        <link rel="stylesheet" href="/assets/css/write-new-trophy.css">
    </head>

    <body>
        <script src="/assets/js/write-new-trophy.js" type="module" defer></script>

        <div class="new-trophy-form">
            <label for="sportclub">Sportclub: </label>
            <input type="text" id="sportclub" />

            <label for="trophyname">Trophyname: </label>
            <input type="text" id="trophyname"/>

            <label for="rank">Rank: </label>
            <input type="number" id="rank" min="1" max="32"/>

            <label for="year">Year: </label>
            <input type="number" id="year" max="2025" min="1850"/>

            <label for="sponsors[]">Sponsors: </label>
            <input type="text" id="sponsors"/>
        </div>

        <button type="button" id="send-trophy-button">Send</button> 
        <button type="button" id="clear-all-fields-button">Clear</button> 
        <button type="button" id="home-button">Home</button> 
    </body>

</html>
